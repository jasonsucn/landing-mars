<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登陆火星 · Landing on Mars</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --surface-0: #05070C;
      --surface-1: #0A0D12;
      --surface-2: #0F131C;
      --surface-3: #161D2B;
      --accent: #E9A568;
      --text: rgba(255, 255, 255, 0.92);
      --text-dim: rgba(255, 255, 255, 0.48);
      --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: "SF Mono", "Consolas", "Monaco", monospace;
    }
    
    body {
      background: var(--surface-0);
      color: var(--text);
      font-family: var(--font-display);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    
    #viewport-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    
    #canvas-target {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
    
    /* Intro Overlay */
    #intro-overlay {
      position: fixed;
      inset: 0;
      background: var(--surface-0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.5rem, 3vw, 2.5rem);
      z-index: 100;
      transition: opacity 0.8s ease-out;
      cursor: pointer;
    }
    
    #intro-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .intro-title {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    
    .intro-subtitle {
      font-size: clamp(0.75rem, 1.5vw, 1rem);
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    
    .intro-cta {
      margin-top: clamp(2rem, 5vw, 4rem);
      font-size: clamp(0.7rem, 1.2vw, 0.85rem);
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--accent);
      opacity: 0.8;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    
    /* Control Bar */
    #control-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: clamp(1rem, 2vw, 1.5rem);
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      z-index: 50;
      transition: opacity 0.4s ease;
      opacity: 0;
      pointer-events: none;
    }
    
    #control-bar.visible {
      opacity: 1;
      pointer-events: all;
    }
    
    .controls-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: clamp(0.75rem, 2vw, 1.5rem);
      font-family: var(--font-mono);
      font-size: clamp(0.7rem, 1vw, 0.85rem);
    }
    
    .control-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-mono);
      font-size: inherit;
    }
    
    .control-btn:hover {
      border-color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.05);
    }
    
    #progress-container {
      position: relative;
      height: 3px;
      background: rgba(255,255,255,0.15);
      border-radius: 999px;
      cursor: pointer;
    }
    
    #progress-bar {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      width: 0%;
      transition: width 0.1s linear;
      pointer-events: none;
    }
    
    .act-tick {
      position: absolute;
      top: -2px;
      width: 1px;
      height: 7px;
      background: rgba(255,255,255,0.5);
      pointer-events: none;
    }
    
    #timecode {
      color: var(--text-dim);
      white-space: nowrap;
    }
    
    /* HUD Overlay */
    #hud-overlay {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 40;
      font-family: var(--font-mono);
      font-size: clamp(0.7rem, 1vw, 0.8rem);
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.05em;
      line-height: 1.6;
      pointer-events: none;
    }
    
    /* Blackout Overlay */
    #blackout-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 45;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s linear;
    }
    
    #blackout-overlay.active {
      opacity: 1;
    }
    
    .blackout-text {
      font-family: var(--font-mono);
      font-size: clamp(1rem, 2vw, 1.5rem);
      color: #fff;
      letter-spacing: 0.15em;
    }
    
    /* End Replay */
    #replay-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    
    #replay-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }
    
    #replay-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 1rem 2.5rem;
      border-radius: 999px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: clamp(0.85rem, 1.2vw, 1rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    
    #replay-btn:hover {
      background: var(--accent);
      color: var(--surface-0);
    }
  </style>
</head>
<body>

<div id="viewport-container">
  <canvas id="canvas-target"></canvas>
  <div id="hud-overlay">
    <div id="hud-vel">VEL: 0.0 M/S</div>
    <div id="hud-alt">ALT: 0.0 KM</div>
  </div>
</div>

<div id="intro-overlay">
  <div class="intro-title">登陆火星</div>
  <div class="intro-subtitle">A Mars Landing Film</div>
  <div class="intro-cta">Click to Begin</div>
</div>

<div id="control-bar">
  <div class="controls-inner">
    <button class="control-btn" id="play-pause-btn">▶</button>
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
    <div id="timecode">00:00 / 01:00</div>
    <button class="control-btn" id="mute-btn">SND OFF</button>
  </div>
</div>

<div id="blackout-overlay">
  <div class="blackout-text">SIGNAL LOST</div>
</div>

<div id="replay-overlay">
  <button id="replay-btn">Replay</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ============== SECTION: CONFIG ============== */

const CONFIG = {
  DURATION: 60,
  ACT_BOUNDARIES: [16, 46],
  ASPECT_RATIO: 2.39,
  MUTED_BY_DEFAULT: true,
  
  BLOOM: {
    STRENGTH: 1.2,
    RADIUS: 0.4,
    THRESHOLD: 0.3
  },
  
  POST: {
    VIGNETTE_STRENGTH: 0.6,
    GRAIN_STRENGTH: 0.08
  },
  
  CAMERA: {
    INITIAL_FOV: 50,
    NEAR: 0.1,
    FAR: 1000
  },
  
  PLACEHOLDER: {
    SPHERE_RADIUS: 1.0,
    SPHERE_EMISSIVE: 0xFF8844,
    SPHERE_INTENSITY: 2.0,
    PARTICLE_COUNT: 180,
    PARTICLE_ORBIT_RADIUS: 3.5,
    PARTICLE_SPEED: 0.3
  },
  
  AUDIO: {
    TEST_BEEP_FREQ: 440,
    TEST_BEEP_DURATION: 0.15
  },
  
  UI: {
    CONTROL_FADE_DELAY: 3000,
    BLACKOUT_START: 21,
    BLACKOUT_END: 22
  }
};

/* ============== SECTION: Render Pipeline ============== */

let scene, camera, renderer, composer, postPass;
let canvas, viewportContainer;
let renderWidth, renderHeight;

function initRenderPipeline() {
  canvas = document.getElementById('canvas-target');
  viewportContainer = document.getElementById('viewport-container');
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  scene.fog = new THREE.FogExp2(0x000a0f, 0.02);
  
  camera = new THREE.PerspectiveCamera(
    CONFIG.CAMERA.INITIAL_FOV,
    CONFIG.ASPECT_RATIO,
    CONFIG.CAMERA.NEAR,
    CONFIG.CAMERA.FAR
  );
  
  renderer = new THREE.WebGLRenderer({ 
    canvas: canvas,
    antialias: true,
    powerPreference: 'high-performance'
  });
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  
  const renderPass = new RenderPass(scene, camera);
  
  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(renderWidth, renderHeight),
    CONFIG.BLOOM.STRENGTH,
    CONFIG.BLOOM.RADIUS,
    CONFIG.BLOOM.THRESHOLD
  );
  
  postPass = new ShaderPass({
    uniforms: {
      tDiffuse: { value: null },
      uTime: { value: 0 },
      uVignetteStrength: { value: CONFIG.POST.VIGNETTE_STRENGTH },
      uGrainStrength: { value: CONFIG.POST.GRAIN_STRENGTH }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform float uTime;
      uniform float uVignetteStrength;
      uniform float uGrainStrength;
      varying vec2 vUv;
      
      float random(vec2 co) {
        return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453);
      }
      
      void main() {
        vec4 color = texture2D(tDiffuse, vUv);
        
        // Vignette
        vec2 center = vUv - 0.5;
        float dist = length(center);
        float vignette = 1.0 - smoothstep(0.3, 1.2, dist * uVignetteStrength * 2.0);
        color.rgb *= vignette;
        
        // Animated grain
        float grain = random(vUv * uTime) * 2.0 - 1.0;
        color.rgb += grain * uGrainStrength;
        
        gl_FragColor = color;
      }
    `
  });
  
  composer = new EffectComposer(renderer);
  composer.addPass(renderPass);
  composer.addPass(bloomPass);
  composer.addPass(postPass);
  
  updateViewportSize();
  window.addEventListener('resize', updateViewportSize);
}

function updateViewportSize() {
  const containerWidth = viewportContainer.clientWidth;
  const containerHeight = viewportContainer.clientHeight;
  const containerAspect = containerWidth / containerHeight;
  
  if (containerAspect > CONFIG.ASPECT_RATIO) {
    renderHeight = containerHeight;
    renderWidth = renderHeight * CONFIG.ASPECT_RATIO;
  } else {
    renderWidth = containerWidth;
    renderHeight = renderWidth / CONFIG.ASPECT_RATIO;
  }
  
  renderer.setSize(renderWidth, renderHeight);
  composer.setSize(renderWidth, renderHeight);
  
  if (camera) {
    camera.aspect = CONFIG.ASPECT_RATIO;
    camera.updateProjectionMatrix();
  }
}

function getPostUniforms() {
  return postPass.uniforms;
}

/* ============== SECTION: Timeline Engine ============== */

const Easing = {
  linear: t => t,
  easeInOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  easeOutQuart: t => 1 - Math.pow(1 - t, 4)
};

function interpolate(a, b, t) {
  if (Array.isArray(a)) {
    return a.map((v, i) => v + (b[i] - v) * t);
  }
  return a + (b - a) * t;
}

/* ============== SECTION: Camera System ============== */

const CAMERA_MOVES = [
  {
    start: 0,
    end: 8,
    from: { pos: [0, 2, 10], look: [0, 0, 0], fov: 50 },
    to: { pos: [0, 1, 6], look: [0, 0, 0], fov: 50 },
    ease: 'easeInOutCubic'
  },
  {
    start: 8,
    end: 60,
    from: { pos: [5, 3, 8], look: [0, 0, 0], fov: 45 },
    to: { pos: [-3, 2, 10], look: [0, 0, 0], fov: 45 },
    ease: 'easeOutQuart'
  }
];

function cameraStateAt(t) {
  for (let move of CAMERA_MOVES) {
    if (t >= move.start && t < move.end) {
      const localT = (t - move.start) / (move.end - move.start);
      const easedT = Easing[move.ease](localT);
      return {
        pos: interpolate(move.from.pos, move.to.pos, easedT),
        look: interpolate(move.from.look, move.to.look, easedT),
        fov: interpolate(move.from.fov, move.to.fov, easedT)
      };
    }
  }
  
  if (t < CAMERA_MOVES[0].start) {
    return {
      pos: CAMERA_MOVES[0].from.pos,
      look: CAMERA_MOVES[0].from.look,
      fov: CAMERA_MOVES[0].from.fov
    };
  }
  
  const lastMove = CAMERA_MOVES[CAMERA_MOVES.length - 1];
  return {
    pos: lastMove.to.pos,
    look: lastMove.to.look,
    fov: lastMove.to.fov
  };
}

/* ============== SECTION: Audio Engine ============== */

const AudioEngine = {
  ctx: null,
  master: null,
  muted: CONFIG.MUTED_BY_DEFAULT,
  cues: [],
  lastT: 0,
  
  init() {
    this.ctx = new AudioContext();
    this.master = this.ctx.createGain();
    this.master.connect(this.ctx.destination);
    this.master.gain.value = this.muted ? 0 : 1;
    
    this.cues = [
      { t: 2.0, id: 'test-beep', fired: false }
    ];
  },
  
  setMuted(muted) {
    this.muted = muted;
    if (this.master) {
      this.master.gain.value = muted ? 0 : 1;
    }
  },
  
  tick(prevT, t) {
    for (let cue of this.cues) {
      if (!cue.fired && prevT < cue.t && t >= cue.t) {
        this.fireCue(cue);
        cue.fired = true;
      }
    }
    this.lastT = t;
  },
  
  fireCue(cue) {
    if (!this.ctx || this.muted) return;
    
    if (cue.id === 'test-beep') {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      
      osc.type = 'sine';
      osc.frequency.value = CONFIG.AUDIO.TEST_BEEP_FREQ;
      
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + CONFIG.AUDIO.TEST_BEEP_DURATION);
      
      osc.connect(gain);
      gain.connect(this.master);
      
      osc.start(this.ctx.currentTime);
      osc.stop(this.ctx.currentTime + CONFIG.AUDIO.TEST_BEEP_DURATION);
    }
  },
  
  resetCues() {
    for (let cue of this.cues) {
      cue.fired = false;
    }
  }
};

/* ============== SECTION: UI Controls ============== */

const UI = {
  introOverlay: null,
  controlBar: null,
  playPauseBtn: null,
  muteBtn: null,
  progressContainer: null,
  progressBar: null,
  timecode: null,
  hudVel: null,
  hudAlt: null,
  blackoutOverlay: null,
  replayOverlay: null,
  replayBtn: null,
  
  controlFadeTimer: null,
  isPlaying: false,
  isDragging: false,
  mouseOverBar: false,
  
  init() {
    this.introOverlay = document.getElementById('intro-overlay');
    this.controlBar = document.getElementById('control-bar');
    this.playPauseBtn = document.getElementById('play-pause-btn');
    this.muteBtn = document.getElementById('mute-btn');
    this.progressContainer = document.getElementById('progress-container');
    this.progressBar = document.getElementById('progress-bar');
    this.timecode = document.getElementById('timecode');
    this.hudVel = document.getElementById('hud-vel');
    this.hudAlt = document.getElementById('hud-alt');
    this.blackoutOverlay = document.getElementById('blackout-overlay');
    this.replayOverlay = document.getElementById('replay-overlay');
    this.replayBtn = document.getElementById('replay-btn');
    
    this.introOverlay.addEventListener('click', () => this.onIntroClick());
    this.playPauseBtn.addEventListener('click', () => this.togglePlayPause());
    this.muteBtn.addEventListener('click', () => this.toggleMute());
    this.replayBtn.addEventListener('click', () => this.onReplay());
    
    this.controlBar.addEventListener('mouseenter', () => {
      this.mouseOverBar = true;
      this.showControls();
    });
    this.controlBar.addEventListener('mouseleave', () => {
      this.mouseOverBar = false;
    });
    
    this.progressContainer.addEventListener('mousedown', (e) => this.onProgressMouseDown(e));
    this.progressContainer.addEventListener('click', (e) => this.onProgressClick(e));
    
    document.addEventListener('mousemove', (e) => {
      this.showControls();
      if (this.isDragging) {
        this.onProgressDrag(e);
      }
    });
    
    document.addEventListener('mouseup', () => {
      this.isDragging = false;
    });
    
    this.createActTicks();
    this.updateMuteButton();
  },
  
  onIntroClick() {
    AudioEngine.init();
    this.introOverlay.classList.add('hidden');
    setTimeout(() => {
      this.isPlaying = true;
      PlaybackEngine.play();
      this.updatePlayButton();
    }, 100);
  },
  
  togglePlayPause() {
    if (this.isPlaying) {
      this.isPlaying = false;
      PlaybackEngine.pause();
    } else {
      this.isPlaying = true;
      PlaybackEngine.play();
    }
    this.updatePlayButton();
  },
  
  toggleMute() {
    AudioEngine.setMuted(!AudioEngine.muted);
    this.updateMuteButton();
  },
  
  updatePlayButton() {
    this.playPauseBtn.textContent = this.isPlaying ? '❚❚' : '▶';
  },
  
  updateMuteButton() {
    this.muteBtn.textContent = AudioEngine.muted ? 'SND OFF' : 'SND ON';
  },
  
  showControls() {
    this.controlBar.classList.add('visible');
    clearTimeout(this.controlFadeTimer);
    
    if (this.isPlaying && !this.mouseOverBar) {
      this.controlFadeTimer = setTimeout(() => {
        this.controlBar.classList.remove('visible');
      }, CONFIG.UI.CONTROL_FADE_DELAY);
    }
  },
  
  onProgressClick(e) {
    const rect = this.progressContainer.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const fraction = Math.max(0, Math.min(1, x / rect.width));
    PlaybackEngine.seek(fraction * CONFIG.DURATION);
  },
  
  onProgressMouseDown(e) {
    this.isDragging = true;
    this.onProgressClick(e);
  },
  
  onProgressDrag(e) {
    if (!this.isDragging) return;
    const rect = this.progressContainer.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const fraction = Math.max(0, Math.min(1, x / rect.width));
    PlaybackEngine.seek(fraction * CONFIG.DURATION);
  },
  
  updateProgress(t) {
    const fraction = t / CONFIG.DURATION;
    this.progressBar.style.width = `${fraction * 100}%`;
    
    const currentMin = Math.floor(t / 60);
    const currentSec = Math.floor(t % 60);
    const totalMin = Math.floor(CONFIG.DURATION / 60);
    const totalSec = Math.floor(CONFIG.DURATION % 60);
    
    this.timecode.textContent = 
      `${String(currentMin).padStart(2, '0')}:${String(currentSec).padStart(2, '0')} / ` +
      `${String(totalMin).padStart(2, '0')}:${String(totalSec).padStart(2, '0')}`;
  },
  
  updateHUD(t) {
    const vel = 2800 - (t / CONFIG.DURATION) * 2400 + Math.sin(t * 0.5) * 50;
    const alt = 120 - (t / CONFIG.DURATION) * 118 + Math.sin(t * 0.3) * 5;
    
    this.hudVel.textContent = `VEL: ${vel.toFixed(1)} M/S`;
    this.hudAlt.textContent = `ALT: ${Math.max(0, alt).toFixed(1)} KM`;
  },
  
  updateBlackout(t) {
    const inBlackout = t >= CONFIG.UI.BLACKOUT_START && t < CONFIG.UI.BLACKOUT_END;
    if (inBlackout) {
      this.blackoutOverlay.classList.add('active');
    } else {
      this.blackoutOverlay.classList.remove('active');
    }
  },
  
  showReplay() {
    this.replayOverlay.classList.add('visible');
  },
  
  hideReplay() {
    this.replayOverlay.classList.remove('visible');
  },
  
  onReplay() {
    this.hideReplay();
    PlaybackEngine.seek(0);
    this.isPlaying = true;
    PlaybackEngine.play();
    this.updatePlayButton();
  },
  
  createActTicks() {
    CONFIG.ACT_BOUNDARIES.forEach(t => {
      const tick = document.createElement('div');
      tick.className = 'act-tick';
      tick.style.left = `${(t / CONFIG.DURATION) * 100}%`;
      this.progressContainer.appendChild(tick);
    });
  }
};

/* ============== SECTION: Act Content (placeholder) ============== */

let testSphere, particleSystem;

function initPlaceholderContent() {
  const sphereGeometry = new THREE.SphereGeometry(CONFIG.PLACEHOLDER.SPHERE_RADIUS, 32, 32);
  const sphereMaterial = new THREE.MeshStandardMaterial({
    color: 0x442211,
    emissive: CONFIG.PLACEHOLDER.SPHERE_EMISSIVE,
    emissiveIntensity: CONFIG.PLACEHOLDER.SPHERE_INTENSITY,
    roughness: 0.7,
    metalness: 0.3
  });
  testSphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
  scene.add(testSphere);
  
  const ambientLight = new THREE.AmbientLight(0x404060, 0.3);
  scene.add(ambientLight);
  
  const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
  directionalLight.position.set(5, 5, 5);
  scene.add(directionalLight);
  
  const particleGeometry = new THREE.BufferGeometry();
  const positions = new Float32Array(CONFIG.PLACEHOLDER.PARTICLE_COUNT * 3);
  const colors = new Float32Array(CONFIG.PLACEHOLDER.PARTICLE_COUNT * 3);
  
  for (let i = 0; i < CONFIG.PLACEHOLDER.PARTICLE_COUNT; i++) {
    const angle = (i / CONFIG.PLACEHOLDER.PARTICLE_COUNT) * Math.PI * 2;
    const radius = CONFIG.PLACEHOLDER.PARTICLE_ORBIT_RADIUS;
    
    positions[i * 3] = Math.cos(angle) * radius;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 0.5;
    positions[i * 3 + 2] = Math.sin(angle) * radius;
    
    colors[i * 3] = 1.0;
    colors[i * 3 + 1] = 0.6 + Math.random() * 0.4;
    colors[i * 3 + 2] = 0.3;
  }
  
  particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  
  const particleMaterial = new THREE.PointsMaterial({
    size: 0.15,
    vertexColors: true,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  
  particleSystem = new THREE.Points(particleGeometry, particleMaterial);
  scene.add(particleSystem);
}

function updatePlaceholderContent(t) {
  if (testSphere) {
    testSphere.rotation.y = t * 0.3;
    const pulse = Math.sin(t * 2) * 0.3 + 1.0;
    testSphere.material.emissiveIntensity = CONFIG.PLACEHOLDER.SPHERE_INTENSITY * pulse;
  }
  
  if (particleSystem) {
    particleSystem.rotation.y = t * CONFIG.PLACEHOLDER.PARTICLE_SPEED;
  }
}

/* ============== SECTION: Main Loop ============== */

const PlaybackEngine = {
  clock: null,
  isPlaying: false,
  currentT: 0,
  prevT: 0,
  
  init() {
    this.clock = new THREE.Clock(false);
  },
  
  play() {
    if (this.currentT >= CONFIG.DURATION) {
      this.seek(0);
    }
    this.isPlaying = true;
    this.clock.start();
    this.prevT = this.currentT;
  },
  
  pause() {
    this.isPlaying = false;
    this.clock.stop();
  },
  
  seek(t) {
    this.currentT = Math.max(0, Math.min(CONFIG.DURATION, t));
    this.prevT = this.currentT;
    this.clock.stop();
    if (this.isPlaying) {
      this.clock.start();
    }
    AudioEngine.resetCues();
    applyState(this.currentT);
  },
  
  tick() {
    if (this.isPlaying) {
      const delta = this.clock.getDelta();
      this.prevT = this.currentT;
      this.currentT = Math.min(this.currentT + delta, CONFIG.DURATION);
      
      AudioEngine.tick(this.prevT, this.currentT);
      
      if (this.currentT >= CONFIG.DURATION) {
        this.isPlaying = false;
        this.clock.stop();
        UI.isPlaying = false;
        UI.updatePlayButton();
        UI.showReplay();
      }
    }
    
    applyState(this.currentT);
  }
};

function applyState(t) {
  const camState = cameraStateAt(t);
  camera.position.set(...camState.pos);
  camera.lookAt(...camState.look);
  camera.fov = camState.fov;
  camera.updateProjectionMatrix();
  
  updatePlaceholderContent(t);
  
  const postUniforms = getPostUniforms();
  postUniforms.uTime.value = t * 5.0;
  
  UI.updateProgress(t);
  UI.updateHUD(t);
  UI.updateBlackout(t);
}

function animate() {
  requestAnimationFrame(animate);
  PlaybackEngine.tick();
  composer.render();
}

function init() {
  initRenderPipeline();
  initPlaceholderContent();
  PlaybackEngine.init();
  UI.init();
  
  applyState(0);
  animate();
}

init();

</script>
