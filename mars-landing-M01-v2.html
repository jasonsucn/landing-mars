<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登陆火星 · Landing on Mars</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --surface-0: #05070C;
      --surface-1: #0A0D12;
      --surface-2: #0F131C;
      --surface-3: #161D2B;
      --accent: #E9A568;
      --text: rgba(255, 255, 255, 0.92);
      --text-dim: rgba(255, 255, 255, 0.48);
      --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: "SF Mono", "Consolas", "Monaco", monospace;
    }
    
    body {
      background: var(--surface-0);
      color: var(--text);
      font-family: var(--font-display);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    
    #viewport-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    
    #canvas-target {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
    
    /* Intro Overlay */
    #intro-overlay {
      position: fixed;
      inset: 0;
      background: var(--surface-0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.5rem, 3vw, 2.5rem);
      z-index: 100;
      transition: opacity 0.8s ease-out;
      cursor: pointer;
    }
    
    #intro-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .intro-title {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    
    .intro-subtitle {
      font-size: clamp(0.75rem, 1.5vw, 1rem);
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    
    .intro-cta {
      margin-top: clamp(2rem, 5vw, 4rem);
      font-size: clamp(0.7rem, 1.2vw, 0.85rem);
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--accent);
      opacity: 0.8;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    
    /* Control Bar */
    #control-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: clamp(1rem, 2vw, 1.5rem);
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      z-index: 50;
      transition: opacity 0.4s ease;
      opacity: 0;
      pointer-events: none;
    }
    
    #control-bar.visible {
      opacity: 1;
      pointer-events: all;
    }
    
    .controls-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: clamp(0.75rem, 2vw, 1.5rem);
      font-family: var(--font-mono);
      font-size: clamp(0.7rem, 1vw, 0.85rem);
    }
    
    .control-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-mono);
      font-size: inherit;
    }
    
    .control-btn:hover {
      border-color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.05);
    }
    
    #progress-container {
      position: relative;
      height: 3px;
      background: rgba(255,255,255,0.15);
      border-radius: 999px;
      cursor: pointer;
    }
    
    #progress-bar {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      width: 0%;
      transition: width 0.1s linear;
      pointer-events: none;
    }
    
    .act-tick {
      position: absolute;
      top: -2px;
      width: 1px;
      height: 7px;
      background: rgba(255,255,255,0.5);
      pointer-events: none;
    }
    
    #timecode {
      color: var(--text-dim);
      white-space: nowrap;
    }
    
    /* HUD Overlay */
    #hud-overlay {
      position: absolute;
      z-index: 40;
      font-family: var(--font-mono);
      font-size: clamp(0.7rem, 1vw, 0.8rem);
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.05em;
      line-height: 1.6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    #hud-overlay.visible {
      opacity: 1;
    }
    
    /* Title Overlay */
    #title-overlay {
      position: absolute;
      z-index: 41;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    #title-overlay.visible {
      opacity: 1;
    }
    
    .title-main {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 2.5vw, 2rem);
      font-weight: 300;
      color: rgba(255,255,255,0.95);
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }
    
    .title-sub {
      font-family: var(--font-mono);
      font-size: clamp(0.65rem, 1.2vw, 0.85rem);
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    
    /* Blackout Overlay */
    #blackout-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 45;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s linear;
    }
    
    #blackout-overlay.active {
      opacity: 1;
    }
    
    .blackout-text {
      font-family: var(--font-mono);
      font-size: clamp(1rem, 2vw, 1.5rem);
      color: #fff;
      letter-spacing: 0.15em;
    }
    
    /* End Replay */
    #replay-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    
    #replay-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }
    
    #replay-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 1rem 2.5rem;
      border-radius: 999px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: clamp(0.85rem, 1.2vw, 1rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.3s;
    }
    
    #replay-btn:hover {
      background: var(--accent);
      color: var(--surface-0);
    }
  </style>
</head>
<body>

<div id="viewport-container">
  <canvas id="canvas-target"></canvas>
  <div id="hud-overlay">

</div>

<div id="intro-overlay">

</div>

<div id="control-bar">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/* ============== SECTION: CONFIG ============== */

const CONFIG = {
  DURATION: 60,
  ACT_BOUNDARIES: [16, 46],
  ASPECT_RATIO: 2.39,
  MUTED_BY_DEFAULT: true,
  
  BLOOM: {
    STRENGTH: 1.2,
    RADIUS: 0.4,
    THRESHOLD: 0.3
  },
  
  POST: {
    VIGNETTE_STRENGTH: 0.6,
    GRAIN_STRENGTH: 0.08
  },
  
  CAMERA: {
    INITIAL_FOV: 50,
    NEAR: 0.1,
    FAR: 1000
  },
  
  AUDIO: {
    TEST_BEEP_FREQ: 440,
    TEST_BEEP_DURATION: 0.15,
    DRONE_FADE_IN_END: 3.0,
    DRONE_FADE_OUT_START: 16.0,
    DRONE_FADE_OUT_END: 17.5
  },
  
  UI: {
    CONTROL_FADE_DELAY: 3000,
    BLACKOUT_START: -1,
    BLACKOUT_END: -1
  },
  
  ACT1: {
    SHOT1_END: 4.5,
    SHOT2_END: 9.0,
    SHOT3_END: 16.0,
    
    STARFIELD: {
      COUNT: 2800,
      SPREAD: 200,
      SIZE_MIN: 0.5,
      SIZE_MAX: 2.5,
      TWINKLE_SPEED: 0.3
    },
    
    MARS: {
      RADIUS: 10,
      INITIAL_DISTANCE: 500,
      COLOR_BASE: 0xC4704F,
      COLOR_DARK: 0x6B3828,
      COLOR_POLAR: 0xE8D5C8,
      ATMOSPHERE_COLOR: 0x88CCFF,
      ATMOSPHERE_INTENSITY: 1.2
    },
    
    SPACECRAFT: {
      HULL_RADIUS: 0.8,
      HULL_HEIGHT: 1.2,
      SERVICE_SIZE: 0.6,
      ANTENNA_SIZE: 0.4,
      ENGINE_GLOW_COLOR: 0xFF6622,
      ENGINE_GLOW_INTENSITY: 0.3
    },
    
    TITLES: [
      {
        start: 0.8,
        end: 4.2,
        main: '火星 · 距离 225 公里',
        sub: 'MARS — 225 KM'
      }
    ],
    
    HUD: {
      SHOT3_START: 9.0,
      VEL_START: 1680,
      VEL_END: 1620,
      ALT_START: 225,
      ALT_END: 195
    }
  }
};

/* ============== SECTION: Render Pipeline ============== */

let scene, camera, renderer, composer, postPass;
let canvas, viewportContainer;
let renderWidth, renderHeight;
let pictureRect = { left: 0, top: 0, width: 0, height: 0 };

function initRenderPipeline() {
  canvas = document.getElementById('canvas-target');
  viewportContainer = document.getElementById('viewport-container');
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  scene.fog = null;
  
  camera = new THREE.PerspectiveCamera(
    CONFIG.CAMERA.INITIAL_FOV,
    CONFIG.ASPECT_RATIO,
    CONFIG.CAMERA.NEAR,
    CONFIG.CAMERA.FAR
  );
  
  renderer = new THREE.WebGLRenderer({ 
    canvas: canvas,
    antialias: true,
    powerPreference: 'high-performance'
  });
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  
  const renderPass = new RenderPass(scene, camera);
  
  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(renderWidth, renderHeight),
    CONFIG.BLOOM.STRENGTH,
    CONFIG.BLOOM.RADIUS,
    CONFIG.BLOOM.THRESHOLD
  );
  
  postPass = new ShaderPass({
    uniforms: {
      tDiffuse: { value: null },
      uTime: { value: 0 },
      uVignetteStrength: { value: CONFIG.POST.VIGNETTE_STRENGTH },
      uGrainStrength: { value: CONFIG.POST.GRAIN_STRENGTH }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform float uTime;
      uniform float uVignetteStrength;
      uniform float uGrainStrength;
      varying vec2 vUv;
      
      float random(vec2 co) {
        return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453);
      }
      
      void main() {
        vec4 color = texture2D(tDiffuse, vUv);
        
        vec2 center = vUv - 0.5;
        float dist = length(center);
        float vignette = 1.0 - smoothstep(0.3, 1.2, dist * uVignetteStrength * 2.0);
        color.rgb *= vignette;
        
        float grain = random(vUv * uTime) * 2.0 - 1.0;
        color.rgb += grain * uGrainStrength;
        
        gl_FragColor = color;
      }
    `
  });
  
  composer = new EffectComposer(renderer);
  composer.addPass(renderPass);
  composer.addPass(bloomPass);
  composer.addPass(postPass);
  
  updateViewportSize();
  window.addEventListener('resize', updateViewportSize);
}

function updateViewportSize() {
  const containerWidth = viewportContainer.clientWidth;
  const containerHeight = viewportContainer.clientHeight;
  const containerAspect = containerWidth / containerHeight;
  
  if (containerAspect > CONFIG.ASPECT_RATIO) {
    renderHeight = containerHeight;
    renderWidth = renderHeight * CONFIG.ASPECT_RATIO;
  } else {
    renderWidth = containerWidth;
    renderHeight = renderWidth / CONFIG.ASPECT_RATIO;
  }
  
  renderer.setSize(renderWidth, renderHeight);
  composer.setSize(renderWidth, renderHeight);
  
  if (camera) {
    camera.aspect = CONFIG.ASPECT_RATIO;
    camera.updateProjectionMatrix();
  }
  
  const canvasRect = canvas.getBoundingClientRect();
  pictureRect = {
    left: canvasRect.left,
    top: canvasRect.top,
    width: canvasRect.width,
    height: canvasRect.height
  };
  
  updateOverlayPositions();
}

function updateOverlayPositions() {
  const hudOverlay = document.getElementById('hud-overlay');
  const titleOverlay = document.getElementById('title-overlay');
  
  const padding = 24;
  
  hudOverlay.style.left = `${pictureRect.left + padding}px`;
  hudOverlay.style.bottom = `${window.innerHeight - pictureRect.top - pictureRect.height + padding}px`;
  
  titleOverlay.style.left = `${pictureRect.left + padding}px`;
  titleOverlay.style.bottom = `${window.innerHeight - pictureRect.top - pictureRect.height + padding * 3}px`;
}

function getPostUniforms() {
  return postPass.uniforms;
}

/* ============== SECTION: Timeline Engine ============== */

const Easing = {
  linear: t => t,
  easeInOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  easeOutQuart: t => 1 - Math.pow(1 - t, 4),
  easeInQuad: t => t * t,
  easeOutQuad: t => 1 - (1 - t) * (1 - t)
};

function interpolate(a, b, t) {
  if (Array.isArray(a)) {
    return a.map((v, i) => v + (b[i] - v) * t);
  }
  return a + (b - a) * t;
}

/* ============== SECTION: Camera System ============== */

const CAMERA_MOVES = [
  {
    start: 0,
    end: CONFIG.ACT1.SHOT1_END,
    from: { pos: [0, 0, 50], look: [0, 1, -500], fov: 45 },
    to: { pos: [0, 0, 45], look: [0, 1, -500], fov: 45 },
    ease: 'linear'
  },
  {
    start: CONFIG.ACT1.SHOT1_END,
    end: CONFIG.ACT1.SHOT2_END,
    from: { pos: [3, 2, 8], look: [0, 0, 0], fov: 55 },
    to: { pos: [2, 1.5, 6], look: [0, 0, 0], fov: 55 },
    ease: 'easeOutQuad'
  },
  {
    start: CONFIG.ACT1.SHOT2_END,
    end: CONFIG.ACT1.SHOT3_END,
    from: { pos: [0, 0, 5], look: [0, 0, -100], fov: 55 },
    to: { pos: [0, -0.5, 4], look: [0, 0, -100], fov: 55 },
    ease: 'easeInQuad'
  },
  {
    start: CONFIG.ACT1.SHOT3_END,
    end: 60,
    from: { pos: [0, 0, 10], look: [0, 0, 0], fov: 50 },
    to: { pos: [0, 0, 10], look: [0, 0, 0], fov: 50 },
    ease: 'linear'
  }
];

function cameraStateAt(t) {
  for (let move of CAMERA_MOVES) {
    if (t >= move.start && t < move.end) {
      const localT = (t - move.start) / (move.end - move.start);
      const easedT = Easing[move.ease](localT);
      return {
        pos: interpolate(move.from.pos, move.to.pos, easedT),
        look: interpolate(move.from.look, move.to.look, easedT),
        fov: interpolate(move.from.fov, move.to.fov, easedT)
      };
    }
  }
  
  if (t < CAMERA_MOVES[0].start) {
    return {
      pos: CAMERA_MOVES[0].from.pos,
      look: CAMERA_MOVES[0].from.look,
      fov: CAMERA_MOVES[0].from.fov
    };
  }
  
  const lastMove = CAMERA_MOVES[CAMERA_MOVES.length - 1];
  return {
    pos: lastMove.to.pos,
    look: lastMove.to.look,
    fov: lastMove.to.fov
  };
}

/* ============== SECTION: Audio Engine ============== */

const AudioEngine = {
  ctx: null,
  master: null,
  muted: CONFIG.MUTED_BY_DEFAULT,
  cues: [],
  lastT: 0,
  droneOsc1: null,
  droneOsc2: null,
  droneGain: null,
  droneFilter: null,
  droneActive: false,
  
  init() {
    this.ctx = new AudioContext();
    this.master = this.ctx.createGain();
    this.master.connect(this.ctx.destination);
    this.master.gain.value = this.muted ? 0 : 1;
    
    this.cues = [];
    this.initDrone();
  },
  
  initDrone() {
    this.droneOsc1 = this.ctx.createOscillator();
    this.droneOsc2 = this.ctx.createOscillator();
    this.droneGain = this.ctx.createGain();
    this.droneFilter = this.ctx.createBiquadFilter();
    
    this.droneOsc1.type = 'sine';
    this.droneOsc1.frequency.value = 55;
    this.droneOsc2.type = 'sine';
    this.droneOsc2.frequency.value = 55.5;
    
    this.droneFilter.type = 'lowpass';
    this.droneFilter.frequency.value = 400;
    this.droneFilter.Q.value = 1;
    
    this.droneGain.gain.value = 0;
    
    this.droneOsc1.connect(this.droneFilter);
    this.droneOsc2.connect(this.droneFilter);
    this.droneFilter.connect(this.droneGain);
    this.droneGain.connect(this.master);
    
    this.droneOsc1.start();
    this.droneOsc2.start();
    this.droneActive = true;
  },
  
  setMuted(muted) {
    this.muted = muted;
    if (this.master) {
      this.master.gain.value = muted ? 0 : 1;
    }
  },
  
  tick(prevT, t) {
    for (let cue of this.cues) {
      if (!cue.fired && prevT < cue.t && t >= cue.t) {
        this.fireCue(cue);
        cue.fired = true;
      }
    }
    this.updateDrone(t);
    this.lastT = t;
  },
  
  updateDrone(t) {
    if (!this.droneActive || !this.droneGain) return;
    
    let targetGain = 0;
    
    if (t < CONFIG.AUDIO.DRONE_FADE_IN_END) {
      targetGain = Math.min(1, t / CONFIG.AUDIO.DRONE_FADE_IN_END) * 0.15;
    } else if (t < CONFIG.AUDIO.DRONE_FADE_OUT_START) {
      targetGain = 0.15;
    } else if (t < CONFIG.AUDIO.DRONE_FADE_OUT_END) {
      const fadeT = (t - CONFIG.AUDIO.DRONE_FADE_OUT_START) / 
                    (CONFIG.AUDIO.DRONE_FADE_OUT_END - CONFIG.AUDIO.DRONE_FADE_OUT_START);
      targetGain = 0.15 * (1 - fadeT);
    } else {
      targetGain = 0;
    }
    
    this.droneGain.gain.setValueAtTime(targetGain, this.ctx.currentTime);
  },
  
  fireCue(cue) {
    if (!this.ctx || this.muted) return;
  },
  
  resetCues() {
    for (let cue of this.cues) {
      cue.fired = false;
    }
  }
};

/* ============== SECTION: UI Controls ============== */

const UI = {
  introOverlay: null,
  controlBar: null,
  playPauseBtn: null,
  muteBtn: null,
  progressContainer: null,
  progressBar: null,
  timecode: null,
  hudOverlay: null,
  hudVel: null,
  hudAlt: null,
  titleOverlay: null,
  titleMain: null,
  titleSub: null,
  blackoutOverlay: null,
  replayOverlay: null,
  replayBtn: null,
  
  controlFadeTimer: null,
  isPlaying: false,
  isDragging: false,
  mouseOverBar: false,
  
  init() {
    this.introOverlay = document.getElementById('intro-overlay');
    this.controlBar = document.getElementById('control-bar');
    this.playPauseBtn = document.getElementById('play-pause-btn');
    this.muteBtn = document.getElementById('mute-btn');
    this.progressContainer = document.getElementById('progress-container');
    this.progressBar = document.getElementById('progress-bar');
    this.timecode = document.getElementById('timecode');
    this.hudOverlay = document.getElementById('hud-overlay');
    this.hudVel = document.getElementById('hud-vel');
    this.hudAlt = document.getElementById('hud-alt');
    this.titleOverlay = document.getElementById('title-overlay');
    this.titleMain = this.titleOverlay.querySelector('.title-main');
    this.titleSub = this.titleOverlay.querySelector('.title-sub');
    this.blackoutOverlay = document.getElementById('blackout-overlay');
    this.replayOverlay = document.getElementById('replay-overlay');
    this.replayBtn = document.getElementById('replay-btn');
    
    this.introOverlay.addEventListener('click', () => this.onIntroClick());
    this.playPauseBtn.addEventListener('click', () => this.togglePlayPause());
    this.muteBtn.addEventListener('click', () => this.toggleMute());
    this.replayBtn.addEventListener('click', () => this.onReplay());
    
    this.controlBar.addEventListener('mouseenter', () => {
      this.mouseOverBar = true;
      this.showControls();
    });
    this.controlBar.addEventListener('mouseleave', () => {
      this.mouseOverBar = false;
    });
    
    this.progressContainer.addEventListener('mousedown', (e) => this.onProgressMouseDown(e));
    this.progressContainer.addEventListener('click', (e) => this.onProgressClick(e));
    
    document.addEventListener('mousemove', (e) => {
      this.showControls();
      if (this.isDragging) {
        this.onProgressDrag(e);
      }
    });
    
    document.addEventListener('mouseup', () => {
      this.isDragging = false;
    });
    
    this.createActTicks();
    this.updateMuteButton();
  },
  
  onIntroClick() {
    AudioEngine.init();
    this.introOverlay.classList.add('hidden');
    setTimeout(() => {
      this.isPlaying = true;
      PlaybackEngine.play();
      this.updatePlayButton();
    }, 100);
  },
  
  togglePlayPause() {
    if (this.isPlaying) {
      this.isPlaying = false;
      PlaybackEngine.pause();
    } else {
      this.isPlaying = true;
      PlaybackEngine.play();
    }
    this.updatePlayButton();
  },
  
  toggleMute() {
    AudioEngine.setMuted(!AudioEngine.muted);
    this.updateMuteButton();
  },
  
  updatePlayButton() {
    this.playPauseBtn.textContent = this.isPlaying ? '❚❚' : '▶';
  },
  
  updateMuteButton() {
    this.muteBtn.textContent = AudioEngine.muted ? 'SND OFF' : 'SND ON';
  },
  
  showControls() {
    this.controlBar.classList.add('visible');
    clearTimeout(this.controlFadeTimer);
    
    if (this.isPlaying && !this.mouseOverBar) {
      this.controlFadeTimer = setTimeout(() => {
        this.controlBar.classList.remove('visible');
      }, CONFIG.UI.CONTROL_FADE_DELAY);
    }
  },
  
  onProgressClick(e) {
    const rect = this.progressContainer.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const fraction = Math.max(0, Math.min(1, x / rect.width));
    PlaybackEngine.seek(fraction * CONFIG.DURATION);
  },
  
  onProgressMouseDown(e) {
    this.isDragging = true;
    this.onProgressClick(e);
  },
  
  onProgressDrag(e) {
    if (!this.isDragging) return;
    const rect = this.progressContainer.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const fraction = Math.max(0, Math.min(1, x / rect.width));
    PlaybackEngine.seek(fraction * CONFIG.DURATION);
  },
  
  updateProgress(t) {
    const fraction = t / CONFIG.DURATION;
    this.progressBar.style.width = `${fraction * 100}%`;
    
    const currentMin = Math.floor(t / 60);
    const currentSec = Math.floor(t % 60);
    const totalMin = Math.floor(CONFIG.DURATION / 60);
    const totalSec = Math.floor(CONFIG.DURATION % 60);
    
    this.timecode.textContent = 
      `${String(currentMin).padStart(2, '0')}:${String(currentSec).padStart(2, '0')} / ` +
      `${String(totalMin).padStart(2, '0')}:${String(totalSec).padStart(2, '0')}`;
  },
  
  updateHUD(t) {
    if (t >= CONFIG.ACT1.HUD.SHOT3_START && t < CONFIG.ACT1.SHOT3_END) {
      const shotT = (t - CONFIG.ACT1.HUD.SHOT3_START) / (CONFIG.ACT1.SHOT3_END - CONFIG.ACT1.HUD.SHOT3_START);
      const vel = interpolate(CONFIG.ACT1.HUD.VEL_START, CONFIG.ACT1.HUD.VEL_END, shotT);
      const alt = interpolate(CONFIG.ACT1.HUD.ALT_START, CONFIG.ACT1.HUD.ALT_END, shotT);
      
      this.hudVel.textContent = `VEL: ${vel.toFixed(1)} M/S`;
      this.hudAlt.textContent = `ALT: ${alt.toFixed(1)} KM`;
      this.hudOverlay.classList.add('visible');
    } else {
      this.hudOverlay.classList.remove('visible');
    }
  },
  
  updateTitles(t) {
    let activeTitle = null;
    for (let title of CONFIG.ACT1.TITLES) {
      if (t >= title.start && t < title.end) {
        activeTitle = title;
        break;
      }
    }
    
    if (activeTitle) {
      this.titleMain.textContent = activeTitle.main;
      this.titleSub.textContent = activeTitle.sub;
      this.titleOverlay.classList.add('visible');
    } else {
      this.titleOverlay.classList.remove('visible');
    }
  },
  
  updateBlackout(t) {
    const inBlackout = t >= CONFIG.UI.BLACKOUT_START && t < CONFIG.UI.BLACKOUT_END;
    if (inBlackout) {
      this.blackoutOverlay.classList.add('active');
    } else {
      this.blackoutOverlay.classList.remove('active');
    }
  },
  
  showReplay() {
    this.replayOverlay.classList.add('visible');
  },
  
  hideReplay() {
    this.replayOverlay.classList.remove('visible');
  },
  
  onReplay() {
    this.hideReplay();
    PlaybackEngine.seek(0);
    this.isPlaying = true;
    PlaybackEngine.play();
    this.updatePlayButton();
  },
  
  createActTicks() {
    CONFIG.ACT_BOUNDARIES.forEach(t => {
      const tick = document.createElement('div');
      tick.className = 'act-tick';
      tick.style.left = `${(t / CONFIG.DURATION) * 100}%`;
      this.progressContainer.appendChild(tick);
    });
  }
};

function createStarfield() {
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(CONFIG.ACT1.STARFIELD.COUNT * 3);
  const sizes = new Float32Array(CONFIG.ACT1.STARFIELD.COUNT);
  const phases = new Float32Array(CONFIG.ACT1.STARFIELD.COUNT);
  
  for (let i = 0; i < CONFIG.ACT1.STARFIELD.COUNT; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = CONFIG.ACT1.STARFIELD.SPREAD;
    
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
    
    sizes[i] = CONFIG.ACT1.STARFIELD.SIZE_MIN + 
               Math.random() * (CONFIG.ACT1.STARFIELD.SIZE_MAX - CONFIG.ACT1.STARFIELD.SIZE_MIN);
    phases[i] = Math.random() * Math.PI * 2;
  }
  
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  geometry.setAttribute('phase', new THREE.BufferAttribute(phases, 1));
  
  const material = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }
    },
    vertexShader: `
      attribute float size;
      attribute float phase;
      uniform float uTime;
      varying float vAlpha;
      
      void main() {
        vAlpha = 0.5 + 0.5 * sin(uTime * 0.3 + phase);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (300.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      varying float vAlpha;
      
      void main() {
        vec2 center = gl_PointCoord - 0.5;
        float dist = length(center);
        if (dist > 0.5) discard;
        float alpha = (1.0 - dist * 2.0) * vAlpha * 0.8;
        gl_FragColor = vec4(1.0, 1.0, 1.0, alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  
  starfield = new THREE.Points(geometry, material);
  scene.add(starfield);
}

function createMars() {
  const geometry = new THREE.SphereGeometry(CONFIG.ACT1.MARS.RADIUS, 64, 64);
  
  const material = new THREE.ShaderMaterial({
    uniforms: {
      uColorBase: { value: new THREE.Color(CONFIG.ACT1.MARS.COLOR_BASE) },
      uColorDark: { value: new THREE.Color(CONFIG.ACT1.MARS.COLOR_DARK) },
      uColorPolar: { value: new THREE.Color(CONFIG.ACT1.MARS.COLOR_POLAR) }
    },
    vertexShader: `
      varying vec3 vPosition;
      varying vec3 vNormal;
      
      void main() {
        vPosition = position;
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uColorBase;
      uniform vec3 uColorDark;
      uniform vec3 uColorPolar;
      varying vec3 vPosition;
      varying vec3 vNormal;
      
      float hash(vec3 p) {
        p = fract(p * 0.3183099 + 0.1);
        p *= 17.0;
        return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
      }
      
      float noise(vec3 x) {
        vec3 i = floor(x);
        vec3 f = fract(x);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                       mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                   mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                       mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
      }
      
      float fbm(vec3 p) {
        float value = 0.0;
        float amplitude = 0.5;
        for (int i = 0; i < 4; i++) {
          value += amplitude * noise(p);
          p *= 2.0;
          amplitude *= 0.5;
        }
        return value;
      }
      
      void main() {
        vec3 p = vPosition * 0.5;
        float n = fbm(p);
        
        float polar = abs(vPosition.y / 10.0);
        float polarBlend = smoothstep(0.7, 1.0, polar);
        
        vec3 color = mix(uColorBase, uColorDark, n);
        color = mix(color, uColorPolar, polarBlend * 0.4);
        
        gl_FragColor = vec4(color, 1.0);
      }
    `
  });
  
  mars = new THREE.Mesh(geometry, material);
  mars.position.set(0, 0, -CONFIG.ACT1.MARS.INITIAL_DISTANCE);
  scene.add(mars);
  
  const atmosphereGeometry = new THREE.SphereGeometry(CONFIG.ACT1.MARS.RADIUS * 1.05, 64, 64);
  const atmosphereMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uAtmosphereColor: { value: new THREE.Color(CONFIG.ACT1.MARS.ATMOSPHERE_COLOR) },
      uIntensity: { value: CONFIG.ACT1.MARS.ATMOSPHERE_INTENSITY }
    },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vViewPosition = -mvPosition.xyz;
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      uniform vec3 uAtmosphereColor;
      uniform float uIntensity;
      varying vec3 vNormal;
      varying vec3 vViewPosition;
      
      void main() {
        vec3 viewDir = normalize(vViewPosition);
        float fresnel = 1.0 - abs(dot(viewDir, vNormal));
        fresnel = pow(fresnel, 3.0);
        
        float alpha = fresnel * uIntensity * 0.6;
        gl_FragColor = vec4(uAtmosphereColor, alpha);
      }
    `,
    transparent: true,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  
  marsAtmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
  mars.add(marsAtmosphere);
}

function updateActContent(t) {
  if (starfield && t < CONFIG.ACT1.SHOT1_END) {
    starfield.material.uniforms.uTime.value = t * CONFIG.ACT1.STARFIELD.TWINKLE_SPEED;
    starfield.visible = true;
  } else if (starfield) {
    starfield.visible = false;
  }
  
  if (mars) {
    if (t < CONFIG.ACT1.SHOT1_END) {
      mars.visible = true;
      const scale = 0.008;
      mars.scale.setScalar(scale);
      mars.position.set(2, 1, -CONFIG.ACT1.MARS.INITIAL_DISTANCE);
    } else if (t < CONFIG.ACT1.SHOT2_END) {
      mars.visible = true;
      const shotT = (t - CONFIG.ACT1.SHOT1_END) / (CONFIG.ACT1.SHOT2_END - CONFIG.ACT1.SHOT1_END);
      const scale = 0.35 + shotT * 0.15;
      mars.scale.setScalar(scale);
      mars.position.set(0, -2, -15 - shotT * 5);
    } else if (t < CONFIG.ACT1.SHOT3_END) {
      mars.visible = true;
      const shotT = (t - CONFIG.ACT1.SHOT2_END) / (CONFIG.ACT1.SHOT3_END - CONFIG.ACT1.SHOT2_END);
      const scale = 1.5 + shotT * 0.3;
      mars.scale.setScalar(scale);
      mars.position.set(0, -10 - shotT * 5, -30 - shotT * 10);
      mars.rotation.y = t * 0.02;
    } else {
      mars.visible = false;
    }
  }
  
  if (spacecraft) {
    if (t >= CONFIG.ACT1.SHOT1_END && t < CONFIG.ACT1.SHOT2_END) {
      spacecraft.visible = true;
      const shotT = (t - CONFIG.ACT1.SHOT1_END) / (CONFIG.ACT1.SHOT2_END - CONFIG.ACT1.SHOT1_END);
      spacecraft.position.set(-1.5 + shotT * 0.3, 0.5 - shotT * 0.2, 2 - shotT * 1);
      spacecraft.rotation.set(0.3, -0.5 + shotT * 0.1, 0.1);
      spacecraft.scale.setScalar(2.5);
      
      if (engineGlow) {
        engineGlow.visible = true;
        engineGlow.material.opacity = CONFIG.ACT1.SPACECRAFT.ENGINE_GLOW_INTENSITY * (0.7 + Math.sin(t * 3) * 0.3);
      }
    } else {
      spacecraft.visible = false;
    }
  }
  
  if (cockpitFrame) {
    if (t >= CONFIG.ACT1.SHOT2_END && t < CONFIG.ACT1.SHOT3_END) {
      cockpitFrame.visible = true;
      const camState = cameraStateAt(t);
      const camPos = new THREE.Vector3(...camState.pos);
      const camLook = new THREE.Vector3(...camState.look);
      const lookDir = new THREE.Vector3().subVectors(camLook, camPos).normalize();
      
      const frameDistance = 3.5;
      const framePos = new THREE.Vector3().addVectors(camPos, lookDir.multiplyScalar(frameDistance));
      cockpitFrame.position.copy(framePos);
      cockpitFrame.lookAt(camLook);
      
      const fovRad = (camState.fov * Math.PI) / 180;
      const frameHalfHeight = Math.tan(fovRad / 2) * frameDistance * 1.15;
      const frameHalfWidth = frameHalfHeight * CONFIG.ASPECT_RATIO * 1.15;
      
      const shotT = (t - CONFIG.ACT1.SHOT2_END) / (CONFIG.ACT1.SHOT3_END - CONFIG.ACT1.SHOT2_END);
      const rimIntensity = 0.015 + shotT * 0.01;
      
      for (let i = 0; i < 4; i++) {
        cockpitFrame.children[i].scale.set(
          i < 2 ? frameHalfWidth * 2 / 8 : 1,
          i < 2 ? 1 : frameHalfHeight * 2 / 5,
          1
        );
      }
      
      for (let i = 4; i < 8; i++) {
        const rimMesh = cockpitFrame.children[i];
        rimMesh.material.opacity = rimIntensity;
        rimMesh.scale.copy(cockpitFrame.children[i - 4].scale);
      }
    } else {
      cockpitFrame.visible = false;
    }
  }
  
  if (renderer && !window._drawCallLogged && Math.abs(t - 10) < 0.016) {
    console.log('Renderer info at t=10s:', renderer.info.render);
    window._drawCallLogged = true;
  }
}

/* ============== SECTION: Main Loop ============== */

const PlaybackEngine = {
  clock: null,
  isPlaying: false,
  currentT: 0,
  prevT: 0,
  
  init() {
    this.clock = new THREE.Clock(false);
  },
  
  play() {
    if (this.currentT >= CONFIG.DURATION) {
      this.seek(0);
    }
    this.isPlaying = true;
    this.clock.start();
    this.prevT = this.currentT;
  },
  
  pause() {
    this.isPlaying = false;
    this.clock.stop();
  },
  
  seek(t) {
    this.currentT = Math.max(0, Math.min(CONFIG.DURATION, t));
    this.prevT = this.currentT;
    this.clock.stop();
    if (this.isPlaying) {
      this.clock.start();
    }
    AudioEngine.resetCues();
    applyState(this.currentT);
  },
  
  tick() {
    if (this.isPlaying) {
      const delta = this.clock.getDelta();
      this.prevT = this.currentT;
      this.currentT = Math.min(this.currentT + delta, CONFIG.DURATION);
      
      AudioEngine.tick(this.prevT, this.currentT);
      
      if (this.currentT >= CONFIG.DURATION) {
        this.isPlaying = false;
        this.clock.stop();
        UI.isPlaying = false;
        UI.updatePlayButton();
        UI.showReplay();
      }
    }
    
    applyState(this.currentT);
  }
};

function applyState(t) {
  const camState = cameraStateAt(t);
  camera.position.set(...camState.pos);
  camera.lookAt(...camState.look);
  camera.fov = camState.fov;
  camera.updateProjectionMatrix();
  
  updateActContent(t);
  
  const postUniforms = getPostUniforms();
  postUniforms.uTime.value = t * 5.0;
  
  UI.updateProgress(t);
  UI.updateHUD(t);
  UI.updateTitles(t);
  UI.updateBlackout(t);
}

function animate() {
  requestAnimationFrame(animate);
  PlaybackEngine.tick();
  composer.render();
}

function init() {
  initRenderPipeline();
  initActContent();
  PlaybackEngine.init();
  UI.init();
  
  applyState(0);
  animate();
}

init();

</script>
